name: daily

# Cron time: full rationale in README.md § Cron. Short version — 09:30 UTC was
# pinned to the MFWAM own-day file (observed published 08:10-08:50 UTC over 12
# sampled days), a constraint that died with the CMEMS retirement. Re-measured
# 2026-08-04 at 07:00 UTC: `daily --dry-run` returns ok on all 7 published
# stations, and the three obs producers are 0.1-1.1h behind real time with the
# previous day complete. Hence 07:30.
#
# The 30min margin only buys protection from a `missing` — which is visible and
# replayable by `backfill`. It buys nothing against the silent failure (Open-Meteo
# serving yesterday's run, which covers the horizon and returns ok all the same);
# that one is unaffected by the hour. Do not widen the margin expecting otherwise.
"on":
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      backfill_since:
        description: >-
          Optional: replay missing history since this date (format
          YYYY-MM-DD) via `scoreboard backfill --since`, instead of the
          normal `scoreboard daily` run. Leave empty for the usual daily run.
        required: false
        type: string

# A schedule trigger can slip by several minutes, and GitHub may skip a run
# if the repo has been inactive for a long stretch — workflow_dispatch above
# is the manual escape hatch for both cases.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          working-directory: pipeline

      - name: uv sync
        working-directory: pipeline
        run: uv sync --locked

      # Buoy observations age out of the Météo-France API on a rolling ~96h
      # window with no archive behind it (measured, see sources/mfbuoy.py).
      # Archive and persist them before the scoreboard: a red daily run must
      # never skip this irreplaceable collection window.
      #
      # `archive-obs` catches its own SourceError and emits `::warning::` so a
      # transient Météo-France outage does not block the scoreboard. A real
      # crash still fails here; deliberately no `continue-on-error`.
      - name: archive buoy observations
        working-directory: pipeline
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: uv run scoreboard archive-obs

      # Persist the expiring observations independently. The path list is
      # intentionally exact: this commit can contain only the buoy catalogue
      # and observation archive, never partial output from a scoreboard run.
      - name: commit buoy observations
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain -- data/buoys.json pipeline/data_obs_archive | grep -q .; then
            git add data/buoys.json pipeline/data_obs_archive
            git commit -m "chore(data): archive buoy observations $(date -u +%F)"
            git pull --rebase
            git push
          else
            echo "no change in buoy observations, nothing to commit"
          fi

      # A single station failure is isolated and recorded as `missing`; the
      # others still publish. An invalid gate or a run where every selected
      # station is missing exits non-zero, turns the job red, and skips the
      # scoreboard commit below. The buoy archive is already safe upstream.
      - name: scoreboard daily
        working-directory: pipeline
        env:
          CANDHIS_API_KEY: ${{ secrets.CANDHIS_API_KEY }}
          # Les deux clés vent, parce que les deux branches ci-dessous n'appellent
          # pas la même API (cf. `sources/mfobs.py`) : `daily` lit l'obs du jour
          # sur DPObs (METEOFRANCE_API_KEY), `backfill` relit l'archive sur
          # DPClim (METEOFRANCE_DPCLIM_API_KEY, qui ouvre aussi DPObs). Sans
          # elles, les 3 stations de vent passent en "missing" sans faire rougir
          # le job — une panne silencieuse, exactement ce qu'on veut éviter ici.
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          METEOFRANCE_DPCLIM_API_KEY: ${{ secrets.METEOFRANCE_DPCLIM_API_KEY }}
          # Never interpolate inputs.backfill_since directly into `run:` —
          # it comes from a workflow_dispatch form field and would otherwise
          # be a script-injection vector. Passed via env instead, and
          # validated below before it ever reaches a command line.
          BACKFILL_SINCE: ${{ inputs.backfill_since }}
        run: |
          set -eu
          if [ -n "$BACKFILL_SINCE" ]; then
            if ! [[ "$BACKFILL_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::backfill_since must be in YYYY-MM-DD format, got: $BACKFILL_SINCE"
              exit 1
            fi
            uv run scoreboard backfill --since "$BACKFILL_SINCE"
          else
            uv run scoreboard daily
          fi

      # Commit only output belonging to a successful scoreboard/backfill run:
      # the public payload, served-forecast archive, and refreshed harmonic
      # constants. Buoy observations were already committed above. If daily
      # exits non-zero this step is skipped, so partial scoreboard state can
      # never be published.
      - name: commit scoreboard data + forecast archive
        env:
          BACKFILL_SINCE: ${{ inputs.backfill_since }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Les constantes harmoniques sont dans la liste parce que le run les
          # ré-ajuste tout seul tous les `harmonic.REFIT_DAYS` : sans ça le fit
          # rafraîchi serait jeté avec le runner, et chaque run d'après le
          # paierait à nouveau (~50 s) sans jamais le persister.
          #
          # Le motif est volontairement `*-harmonic.joblib` et non `pipeline/models`
          # entier. Les deux autres répertoires ont l'invariant « tout ce qui y
          # change pendant un run est légitime à commiter automatiquement » ;
          # `pipeline/models` ne l'a pas — il contient `gate.json` et les `.joblib`
          # du modèle ML, qui n'ont jamais changé que par un retrain local et
          # humain. Un `git add` au répertoire ouvrirait la première voie de
          # commit automatique vers ces fichiers-là.
          if git status --porcelain -- data ':(exclude)data/buoys.json' pipeline/data_forecast_archive 'pipeline/models/*-harmonic.joblib' | grep -q .; then
            git add data ':(exclude)data/buoys.json' pipeline/data_forecast_archive 'pipeline/models/*-harmonic.joblib'
            if [ -n "$BACKFILL_SINCE" ]; then
              git commit -m "chore(data): backfill since $BACKFILL_SINCE"
            else
              git commit -m "chore(data): daily run $(date -u +%F)"
            fi
            git pull --rebase
            git push
          else
            echo "no change in scoreboard data or forecast archive, nothing to commit"
          fi
