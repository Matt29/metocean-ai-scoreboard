name: daily

# Cron time: see docs/data-sources.md §4 for the original spike, and
# task-10-report.md for the empirical check that pins this specific hour.
# Summary: the MFWAM run's own-day file (`R<run_date>_00H`) was observed
# published between 08:10 and 08:50 UTC over 12 sampled days (2026-07-20 to
# 2026-08-03, via the CMEMS native-files S3 bucket's LastModified timestamps).
# 09:30 UTC leaves ~40min margin over the worst observed case.
"on":
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      backfill_since:
        description: >-
          Optional: replay missing history since this date (format
          YYYY-MM-DD) via `scoreboard backfill --since`, instead of the
          normal `scoreboard daily` run. Leave empty for the usual daily run.
        required: false
        type: string

# A schedule trigger can slip by several minutes, and GitHub may skip a run
# if the repo has been inactive for a long stretch — workflow_dispatch above
# is the manual escape hatch for both cases.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          working-directory: pipeline

      - name: uv sync
        working-directory: pipeline
        run: uv sync --locked

      # Station-level failures (a transient 503, a gated-out station, a
      # source outage) are caught inside `scoreboard.daily.run` and recorded
      # as `"status": "missing"` per station — that's a normal daily outcome,
      # not a workflow failure. This step only turns the job red on a real
      # failure: an uncaught exception, a broken env, or anything else that
      # escapes `daily.run` and makes `scoreboard daily` exit non-zero.
      - name: scoreboard daily
        working-directory: pipeline
        env:
          CANDHIS_API_KEY: ${{ secrets.CANDHIS_API_KEY }}
          # Les deux clés vent, parce que les deux branches ci-dessous n'appellent
          # pas la même API (cf. `sources/mfobs.py`) : `daily` lit l'obs du jour
          # sur DPObs (METEOFRANCE_API_KEY), `backfill` relit l'archive sur
          # DPClim (METEOFRANCE_DPCLIM_API_KEY, qui ouvre aussi DPObs). Sans
          # elles, les 3 stations de vent passent en "missing" sans faire rougir
          # le job — une panne silencieuse, exactement ce qu'on veut éviter ici.
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          METEOFRANCE_DPCLIM_API_KEY: ${{ secrets.METEOFRANCE_DPCLIM_API_KEY }}
          # Never interpolate inputs.backfill_since directly into `run:` —
          # it comes from a workflow_dispatch form field and would otherwise
          # be a script-injection vector. Passed via env instead, and
          # validated below before it ever reaches a command line.
          BACKFILL_SINCE: ${{ inputs.backfill_since }}
        run: |
          set -eu
          if [ -n "$BACKFILL_SINCE" ]; then
            if ! [[ "$BACKFILL_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::backfill_since must be in YYYY-MM-DD format, got: $BACKFILL_SINCE"
              exit 1
            fi
            uv run scoreboard backfill --since "$BACKFILL_SINCE"
          else
            uv run scoreboard daily
          fi

      # Buoy observations age out of the Météo-France API on a rolling ~96h
      # window with no archive behind it (measured, see sources/mfbuoy.py), so
      # every hour not captured here is lost for good — this is the only thing
      # that makes the Med training corpus of demande produit 4 start counting.
      #
      # A Météo-France outage must never cost the scoreboard its daily commit,
      # so `archive-obs` catches its own SourceError and emits `::warning::`
      # instead of exiting non-zero (see cli.py). Deliberately NOT
      # `continue-on-error: true`, which would swallow a real crash too and
      # leave a write-only data path green and silent forever.
      # Runs *after* `scoreboard daily` for the same order of priorities:
      # scoring first, opportunistic collection second.
      - name: archive buoy observations
        working-directory: pipeline
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: uv run scoreboard archive-obs

      # Commit only what actually changed, and only the three directories the
      # daily run is allowed to write: the public scoreboard payload (data/),
      # the served-forecast archive (pipeline/data_forecast_archive/) and the
      # buoy observation archive (pipeline/data_obs_archive/) — the corpora a
      # future retrain needs (see docs/data-sources.md §4bis and §5).
      # Nothing else is ever staged.
      - name: commit data + archives
        env:
          BACKFILL_SINCE: ${{ inputs.backfill_since }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain -- data pipeline/data_forecast_archive pipeline/data_obs_archive | grep -q .; then
            git add data pipeline/data_forecast_archive pipeline/data_obs_archive
            if [ -n "$BACKFILL_SINCE" ]; then
              git commit -m "chore(data): backfill since $BACKFILL_SINCE"
            else
              git commit -m "chore(data): daily run $(date -u +%F)"
            fi
            git pull --rebase
            git push
          else
            echo "no change in data/ or the archives, nothing to commit"
          fi
