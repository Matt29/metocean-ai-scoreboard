[project]
name = "scoreboard"
version = "0.1.0"
description = "Pipeline metocean AI scoreboard"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
