[project]
name = "scoreboard"
version = "0.1.0"
description = "Pipeline metocean AI scoreboard"
requires-python = ">=3.12"
dependencies = [
    "copernicusmarine>=2.4.1",
    "joblib>=1.5.3",
    "netcdf4>=1.7.4",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "utide>=0.3.1",
    "xarray>=2026.7.0",
]

[project.scripts]
scoreboard = "scoreboard.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
