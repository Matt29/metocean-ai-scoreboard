name: ci

# Path-scoped: daily archive-only commits must not trigger CI.  Negated paths
# must come after their positive parent pattern in GitHub Actions syntax.
on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "!pipeline/data_forecast_archive/**"
      - "!pipeline/data_obs_archive/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "!pipeline/data_forecast_archive/**"
      - "!pipeline/data_obs_archive/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          working-directory: pipeline

      - name: uv sync
        working-directory: pipeline
        run: uv sync --locked

      - name: pytest
        working-directory: pipeline
        run: uv run pytest -q

      - name: ruff
        working-directory: pipeline
        run: uv run ruff check src scripts tests
